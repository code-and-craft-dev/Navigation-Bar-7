<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliding Expanding Pill Navigation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f2ee;
      --dock-bg: #ffffff;
      --inactive: #8c827a;
      --pill-bg: linear-gradient(135deg, #0284c7, #2563eb);
      --pill-glow: rgba(37, 99, 235, 0.45);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg) radial-gradient(rgba(41, 37, 36, 0.08) 1.2px, transparent 1.2px) 0 0 / 24px 24px;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Floating Dock */
    .dock {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px;
      background: var(--dock-bg);
      border-radius: 34px;
      box-shadow: 
        0 24px 48px -12px rgba(41, 37, 36, 0.12),
        0 2px 4px rgba(41, 37, 36, 0.04),
        0 0 50px -10px var(--pill-glow),
        inset 0 1px 1.5px #fff;
      transition: box-shadow 0.4s ease;
    }

    /* Liquid Elastic Indicator */
    .indicator {
      position: absolute;
      top: 7px;
      left: 7px;
      height: 50px;
      width: 122px;
      border-radius: 25px;
      background: var(--pill-bg);
      box-shadow: 
        inset 0 1.2px 1.5px rgba(255, 255, 255, 0.45),
        inset 0 -1.5px 2px rgba(0, 0, 0, 0.18),
        0 4px 12px rgba(0, 0, 0, 0.1),
        0 12px 28px -4px var(--pill-glow);
      pointer-events: none;
      transition: transform 0.42s cubic-bezier(0.34, 1.3, 0.64, 1),
                  background 0.35s ease,
                  box-shadow 0.35s ease;
    }

    /* Navigation Items */
    .nav-btn {
      position: relative;
      height: 50px;
      width: 50px;
      border: none;
      background: none;
      cursor: pointer;
      border-radius: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 15px;
      color: var(--inactive);
      overflow: hidden;
      z-index: 2;
      outline: none;
      transition: color 0.3s ease, width 0.42s cubic-bezier(0.34, 1.3, 0.64, 1);
    }

    .nav-btn:hover { color: #18181b; }
    .nav-btn.active { width: 122px; color: #fff; }

    /* Centered SVG Icons */
    .nav-btn svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    .nav-btn.active svg { stroke-width: 2.3; }

    /* Kinetic Micro-Animations */
    .nav-btn.active .icon-bounce { animation: bounce 0.45s cubic-bezier(0.34, 1.5, 0.64, 1); }
    .nav-btn.active .icon-tilt   { animation: tilt 0.45s cubic-bezier(0.34, 1.5, 0.64, 1); }
    .nav-btn.active .icon-beat   { animation: beat 0.5s cubic-bezier(0.34, 1.6, 0.64, 1); }
    .nav-btn.active .icon-wave   { animation: wave 0.45s cubic-bezier(0.34, 1.5, 0.64, 1); }

    @keyframes bounce { 40% { transform: translateY(-3px) scale(1.12); } }
    @keyframes tilt   { 45% { transform: rotate(-16deg) scale(1.15); } }
    @keyframes beat   { 35% { transform: scale(1.26); } 65% { transform: scale(0.92); } }
    @keyframes wave   { 50% { transform: scaleY(1.22); } }

    /* Kinetic Typography */
    .label {
      margin-left: 8px;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.4px;
      white-space: nowrap;
      opacity: 0;
      max-width: 0;
      overflow: hidden;
      transform: translateY(4px);
      transition: opacity 0.2s ease, max-width 0.42s cubic-bezier(0.34, 1.3, 0.64, 1), transform 0.3s ease, letter-spacing 0.3s ease;
    }

    .nav-btn.active .label {
      opacity: 1;
      max-width: 70px;
      letter-spacing: 0.2px;
      transform: translateY(0);
      transition: opacity 0.25s ease 0.08s, max-width 0.42s cubic-bezier(0.34, 1.3, 0.64, 1), transform 0.35s cubic-bezier(0.34, 1.3, 0.64, 1) 0.05s, letter-spacing 0.35s ease 0.05s;
    }
  </style>
</head>
<body>

  <nav class="dock" id="dock" aria-label="Navigation Dock">
    <div class="indicator" id="indicator"></div>

    <button class="nav-btn active" aria-label="Home">
      <svg class="icon-bounce" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="label">Home</span>
    </button>

    <button class="nav-btn" aria-label="Search">
      <svg class="icon-tilt" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span class="label">Search</span>
    </button>

    <button class="nav-btn" aria-label="Saved">
      <svg class="icon-beat" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
      <span class="label">Saved</span>
    </button>

    <button class="nav-btn" aria-label="Stats">
      <svg class="icon-wave" viewBox="0 0 24 24"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
      <span class="label">Stats</span>
    </button>

    <button class="nav-btn" aria-label="Profile">
      <svg class="icon-bounce" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="label">Profile</span>
    </button>
  </nav>

  <script>
    const dock = document.getElementById('dock');
    const items = document.querySelectorAll('.nav-btn');
    const indicator = document.getElementById('indicator');
    let current = 0;

    const colors = [
      ['linear-gradient(135deg, #0284c7, #2563eb)', 'rgba(37, 99, 235, 0.45)'],
      ['linear-gradient(135deg, #ea580c, #f97316)', 'rgba(249, 115, 22, 0.45)'],
      ['linear-gradient(135deg, #e11d48, #f43f5e)', 'rgba(225, 29, 72, 0.45)'],
      ['linear-gradient(135deg, #059669, #10b981)', 'rgba(16, 185, 129, 0.45)'],
      ['linear-gradient(135deg, #9333ea, #c026d3)', 'rgba(168, 85, 247, 0.45)']
    ];

    items.forEach((item, i) => {
      item.onclick = () => {
        if (i === current) return;
        items[current].classList.remove('active');
        item.classList.add('active');

        dock.style.setProperty('--pill-bg', colors[i][0]);
        dock.style.setProperty('--pill-glow', colors[i][1]);

        const stretch = 1 + Math.min(Math.abs(i - current) * 0.14, 0.35);
        indicator.style.transform = `translateX(${i * 58}px) scale(${stretch}, ${1 / Math.sqrt(stretch)})`;
        setTimeout(() => indicator.style.transform = `translateX(${i * 58}px) scale(1, 1)`, 130);

        current = i;
      };
    });
  </script>
</body>
</html>
